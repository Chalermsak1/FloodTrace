services:
  # Automated HTTPS Reverse Proxy (Automatic Let's Encrypt SSL/TLS)
  caddy:
    image: caddy:2-alpine
    container_name: floodtrace_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - floodtrace_caddy_data:/data
      - floodtrace_caddy_config:/config
    depends_on:
      - web
    networks:
      - floodtrace_net

  # Spatial Database: PostgreSQL 16 with PostGIS 3.4
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: floodtrace_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-floodtrace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${POSTGRES_DB:-floodtrace_db}
    volumes:
      - floodtrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floodtrace_user} -d ${POSTGRES_DB:-floodtrace_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - floodtrace_net

  # FloodTrace FastAPI Backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: floodtrace_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-floodtrace_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-floodtrace_db}
      ENVIRONMENT: production
      DATA_ENV: PRODUCTION
      REQUIRE_PRIVATE_ACCESS_FOR_PRODUCTION: "false"
      ALLOW_OFFICIAL_PUBLIC_PRODUCTION: "true"
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set in production}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-https://${DOMAIN:-localhost}}
      ENABLE_SCHEDULER: "true"
      THAIWATER_API_KEY: ${THAIWATER_API_KEY:-}
      PRIVATE_MEDIA_ROOT: /app/data/private-media
    volumes:
      - ruwaigon_private_media:/app/data/private-media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - floodtrace_net

  # FloodTrace Web Frontend (Nginx SPA + Internal API Proxy)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: floodtrace_web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - floodtrace_net

volumes:
  floodtrace_pgdata:
  floodtrace_caddy_data:
  floodtrace_caddy_config:
  ruwaigon_private_media:
    name: ruwaigon_private_media

networks:
  floodtrace_net:
    driver: bridge
